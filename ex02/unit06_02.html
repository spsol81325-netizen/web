<!DOCTYPE HTML>
<html>
	<head>
		<title>동적 가상 클래스 선택자</title>
		<meta charset="UTF-8" />
		<style type="text/css">
		/* input 요소의 상태에 따른 선택자를 정의합니다. */
			/* 첫번째 li 태그  */
         li{background: silver; color: brown; width: 500px}
         li:first-child{background: yellowgreen;}
         li:last-child{background: yellowgreen;}
      /* 짝수번째 li 태그  */
         li:nth-child(even){
            background: violet;
         }
         li:nth-child(odd){
            background: rgb(222, 130, 18);
         }
      /* 세번째 li 태그  */
         li:nth-child(3){background: red;}
		</style>
	</head>

	<body>
		<h1>동적 관련 가상 클래스 선택자</h1>
		<hr />
		<h2>로그인</h2> 
        <form action="#" method="post">
				<fieldset>
						<p><label>아이디</label>
							<input name="userID" type="text" />
						</p>
						<p><label>비밀번호</label>
							<input name="userPWD" type="password" />
						</p>
						<p>
							<input type="submit" value="login" />
						</p>
					</fieldset>
        </form>
	</body>
</html>
